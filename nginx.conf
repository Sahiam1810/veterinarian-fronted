server {
    listen 80;
    server_name huellitas.chatcampuslands.com;

    root /usr/share/nginx/html;
    index index.html;

    # El SPA llama a la API por dominio propio (VITE_API_URL).
    # Este proxy cubre same-origin /api y /hubs si se usa ruta relativa.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream https://api.huellitas.chatcampuslands.com;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.huellitas.chatcampuslands.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.huellitas.chatcampuslands.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
